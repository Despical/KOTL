# ======================================================== #
#        King of the Ladder - BossBar Configuration        #
# ======================================================== #
#                                                          #
#  BAR STYLES:                                             #
#    - PROGRESS   : Solid, undivided bar                   #
#    - NOTCHED_6  : Divided into 6 segments                #
#    - NOTCHED_10 : Divided into 10 segments               #
#    - NOTCHED_12 : Divided into 12 segments               #
#    - NOTCHED_20 : Divided into 20 segments               #
#                                                          #
#  BAR COLORS:                                             #
#    - PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE       #
#                                                          #
# ======================================================== #

# Determines whether this BossBar configuration is enabled.
# The global and arena-specific BossBar switches must also be enabled.
enabled: true

# BossBar appearance used while players are inside a King of the Ladder arena.
# The text supports Adventure MiniMessage formatting.
text: "<yellow><bold>Playing <gradient:#ff3b3b:#ff7a7a>KING OF THE LADDER</gradient> <yellow><bold>by <aqua><bold>DESPICAL"
overlay: PROGRESS
color: BLUE
