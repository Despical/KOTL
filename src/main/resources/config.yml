# Choose the storage method for player statistics. Supported values are flat_file or mysql.
# Data migration is not supported, and changes only take effect after a server restart or plugin reload.
database: flat_file

arena-schedulers:
  # Select how players entering and leaving game areas are detected.
  # Type 1 periodically checks all online players; type 2 listens for block-to-block movement.
  type: 1

  # How often the type 1 arena detector should run, in server ticks.
  # Lower values detect transitions sooner; higher values reduce check frequency.
  interval: 2

  # Whether arena detection may use asynchronous processing where supported.
  # Keep this disabled unless the selected scheduler explicitly supports asynchronous checks.
  async: false

king-settings:
  # If enabled, the current king can earn the crown again after their arena cooldown expires.
  become-king-in-a-row: true

  # Delay, in seconds, before a player can become king again in the same arena.
  # Set to 0 to disable the king cooldown.
  cooldown: 5

  # Players with this permission bypass the king cooldown.
  # Leave empty to disable permission-based bypassing.
  cooldown-override-permission: ""

  # If enabled, the remaining king cooldown is displayed in the action bar.
  cooldown-bar: true

  # If enabled, king cooldowns are also applied when only one player is in the arena.
  cooldown-when-alone: false

  # If enabled, an active cooldown bar is restored when a player rejoins the same arena.
  show-cooldown-on-rejoin: true

  # Pushes a successful king away from the plate so narrow towers cannot be held indefinitely.
  plate-knockback:
    # If enabled, becoming king applies knockback from the king plate.
    enabled: true

    # Horizontal knockback strength applied away from the plate.
    horizontal-strength: 1.25

    # Upward velocity applied together with horizontal knockback.
    vertical-strength: 0.45

# If enabled, players can see the King of the Ladder boss bar while playing.
# This is the global boss bar switch; arenas can still disable their own boss bar separately.
boss-bar-enabled: true

# If enabled, players can see the King of the Ladder scoreboard while playing.
# This is the global scoreboard switch; arenas can still disable their own scoreboard separately.
scoreboard-enabled: true

player-settings:
  # If enabled, player inventories are cleared while they are inside an arena.
  # Saved inventory contents are restored when the player leaves.
  clear-inventory-on-join: true

  # If enabled, active potion effects are cleared when players enter an arena.
  clear-effects-on-join: true

chat-settings:
  # When enabled, each arena has an isolated chat channel.
  # Arena players only see messages from players in the same arena.
  separate-chat: true

  # When enabled, players inside arenas cannot receive messages sent outside games.
  block-outside-chat: true

  # When enabled, players who are actively in an arena cannot send chat messages.
  disable-chat-in-game: false

  # Whether the plugin should format arena chat using the chat-format value in messages.yml.
  # If false, the server's normal chat formatting is preserved.
  enable-formatting: true

# If enabled, fall damage is cancelled for players inside arenas.
disable-fall-damage: true

# Controls the particle outline shown while an administrator previews a game area.
arena-outlines:
  # Distance between particles along each edge of the selected area.
  step: .4

  # Bukkit particle used to draw the game area outline.
  particle: FLAME

command-settings:
  # When enabled, players who are actively in a KOTL arena can only use commands listed below.
  disable-commands-while-playing: true

  # Commands players may still use while playing.
  # Use command roots such as "msg" to allow all arguments, or subcommands such as "kotl leave".
  allowed-commands:
    - "kotl leave"
    - "kotl stats"

# If enabled, a firework celebration is spawned around the game area when a player becomes king.
fireworks-on-new-king: true

# If enabled, players can pick up dropped items and arrows while inside arenas.
# When disabled, attempted pickups are removed from the world.
pick-up-items: false

notify:
  # If enabled, arena players are notified when another player joins.
  join: true

  # If enabled, remaining arena players are notified when someone leaves.
  leave: true

# If enabled, the plugin checks for newer releases on startup.
update-notifier: true
