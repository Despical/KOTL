  - ""
  - "<#CFD8DC>The arena '<#00B0FF>%id%<#CFD8DC>' has been successfully registered."
  - "<#CFD8DC>You can now configure the settings."
  - ""
  - "<click:run_command:/kotl edit %id%><hover:show_text:'<#69F0AE>Click to configure this arena.'><#FFD740><bold><underlined>CLICK HERE TO SETUP</underlined></bold></hover></click>"
  - ""
  - "<#37474F><st>                                                                                 </st>"

