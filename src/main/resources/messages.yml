# ==================================================================
#         King of the Ladder - Message Configuration               #
# ==================================================================
#                                                                  #
# Messages support Adventure MiniMessage tags such as:             #
#   <green>, <#FFCA28>, <bold>, <italic>, gradients, hover events, #
#   click events, and other MiniMessage components.                #
#                                                                  #
# COMMON PLACEHOLDERS:                                             #
#   %player%           : Name of the player                        #
#   %arena%            : Arena id                                  #
#   %arena_id%         : Arena id used by setup messages           #
#   %id%               : Arena id used by commands                 #
#   %label%            : Command label used by the sender          #
#   %king%             : Name of the current or new king           #
#   %time%             : Remaining cooldown time                   #
#   %progress%         : Cooldown progress bar                     #
#                                                                  #
# Some messages use additional placeholders documented by context. #
#                                                                  #
# ================================================================ #

# Game Messages
game:
  player-joined: "<#00E676>+ <#FFD54F>%player% <#BDBDBD>joined the arena."
  player-left: "<#FF5252>- <#FFD54F>%player% <#BDBDBD>left the arena."
  new-king: "<#FFD700>♛ <#FFD54F>%king% <#BDBDBD>is the new king!"
  king-retained: "<#FFCA28>♛ <#FFD54F>%king% <#BDBDBD>kept the crown!"
  chat-disabled-in-game: "<#FF5252>✖ <#BDBDBD>You cannot send chat messages while in a game!"
  command-disabled-in-game: "<#FF5252>✖ <#BDBDBD>You cannot use that command while playing."
  cooldown-format: "<gradient:#FFD700:#FF8F00><bold>♛ KING COOLDOWN</bold></gradient> <dark_gray>• <reset>%progress% <dark_gray>• <#FFF8E1><bold>%time%s</bold>"

chat-format: "<gray>%sender%<dark_gray>: <white>%message%"
not-playing: "<#FF1744>✖ <#BDBDBD>You are not playing <#FFD54F><bold>King of the Ladder</bold> <#BDBDBD>right now."
none: "<#FF5252>None"

# System Messages
server-reload-detected:
  - ""
  - "<#FF5252><bold>Game cancelled due to reload. Stats were not affected."
  - ""

server-shutdown-detected:
  - ""
  - "<#FF5252><bold>Game cancelled due to shutdown. Stats were not affected."
  - ""

game-stopped-by-command:
  - ""
  - "<#FF5252><bold>Game cancelled by an administrator. Stats were not affected."
  - ""

game-stopped-due-to-arena-deletion:
  - ""
  - "<#FF5252><bold>The arena you were playing in was deleted by an admin. Stats were not affected."
  - ""

game-stopped-due-to-arena-disable:
  - ""
  - "<#FFCA28><bold>The arena was disabled for maintenance. Stats were not affected."
  - ""

# Arena Messages
setup:
  area-selector-received: "<#00E676>✔ <#BDBDBD>Area selector received. <#43A047>LEFT <#BDBDBD>click first corner, <#29B6F6>RIGHT <#BDBDBD>click second corner."
  area-first-position-set: "<#00E676>✔ <#BDBDBD>First position set at [<#FFD54F>%first_xyz%<#BDBDBD>]. <#29B6F6>Right-click <#BDBDBD>to select the second position."
  area-first-position-required: "<#FF5252>✖ <#BDBDBD>You must set the first position using <#43A047>left-click<#BDBDBD>."
  area-selection-complete: "<#00E676>✔ <#BDBDBD>Game Area saved. <#90CAF9>First: <#BDBDBD>[<#FFD54F>%first_xyz%<#BDBDBD>] <#90CAF9>Second: <#BDBDBD>[<#FFD54F>%second_xyz%<#BDBDBD>] <#90CAF9>Blocks: <#FFD54F>%blocks%"
  area-outline-enabled: "<#00E676>✔ <#BDBDBD>Game Area outline visualizer enabled."
  area-outline-disabled: "<#FF5252>✖ <#BDBDBD>Game Area outline visualizer disabled."
  king-plate-tool-received: "<#FFD700>✔ <#BDBDBD>King plate tool received. Place it wherever the king trigger should be."
  king-plate-set: "<#FFD700>✔ <#BDBDBD>King plate location has been set successfully."
  king-plate-outside-game-area: "<#FFCA28>⚠ <#BDBDBD>The King Plate is outside the Game Area. Move the plate or select the Game Area again."
  king-plate-material-selected: "<#00E676>✔ <#BDBDBD>King plate material changed to <#FFD54F>%material%<#BDBDBD>."
  arena-record-reset: "<#00E676>✔ <#BDBDBD>King records for <#29B6F6><bold>%arena_id%</bold> <#BDBDBD>have been reset."
  arena-enabled: "<#00E676>✔ <#BDBDBD>Arena <#29B6F6><bold>%arena_id%</bold> <#BDBDBD>is now enabled and detecting players."
  arena-disabled: "<#FFCA28>⚠ <#BDBDBD>Arena <#29B6F6><bold>%arena_id%</bold> <#BDBDBD>is now disabled and can be edited safely."

created-arena:
