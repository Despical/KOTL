# =============================================================== #
#          King of the Ladder - Scoreboard Configuration          #
# =============================================================== #
#                                                                 #
# SUPPORTED PLACEHOLDERS:                                         #
#   %player%          : Name of the player                        #
#   %date%            : Current date                              #
#   %arena%           : Id of the current arena                   #
#   %players%         : Current number of players in the arena    #
#   %king%            : Current king                              #
#   %last_king%       : Most recent king                          #
#   %top_king%        : Arena record holder                       #
#   %top_king_score%  : Arena record score                        #
#   %score%           : Player's total king score                 #
#   %arena_score%     : Player's score in the current arena       #
#   %tours_played%    : Player's total tours played               #
#   %kills%           : Player's total kills                      #
#   %deaths%          : Player's total deaths                     #
#                                                                 #
# =============================================================== #

# Scoreboard shown while a player is inside a King of the Ladder arena.
title: "<#FFC800><bold>KING OF THE LADDER"
lines:
  - "<#B0C4DE>%date%"
  - ""
  - "<#EEF2F7>Arena: <#00FF95>%arena%"
  - "<#EEF2F7>Players: <#00FF95>%players%"
  - ""
  - "<#EEF2F7>King: <#FFD54F>%king%"
  - "<#CFE8FF>Last King: <#29B6F6>%last_king%"
  - "<#F3DDFF>Top King: <#E040FB>%top_king% <gray>(%top_king_score%)"
  - ""
  - "<#EEF2F7>Total Score: <#00E676>%score%"
  - "<#DFF8E8>Arena Score: <#00E676>%arena_score%"
  - ""
  - "<#FFC800>docs.despical.dev"
